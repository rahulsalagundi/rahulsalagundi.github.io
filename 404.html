<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · pod not found · Rahul M Salagundi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .nf__box { width: min(640px, 100%); }
    .nf h1 { margin: 0 0 8px; font: 700 clamp(64px, 14vw, 140px)/1 var(--f-display); letter-spacing: -0.04em; }
    .nf p { color: var(--muted); }
    .nf .term { margin: 24px 0; }
    .crit { color: #fb7185; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <main class="nf">
    <div class="nf__box">
      <h1 class="accent">404</h1>
      <p class="mono">Error from server (NotFound): the route you requested does not exist.</p>
      <div class="term">
        <div class="term__bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term__title">kubectl</span></div>
<pre class="term__body"><span class="t-ps">❯</span> <span class="t-cmd">kubectl get pod <span id="path">this-page</span></span>
<span class="t-dim">NAME          READY   STATUS             RESTARTS</span>
<span id="path2">this-page</span>     0/1     <span class="crit">CrashLoopBackOff</span>   7
<span class="t-ps">❯</span> <span class="t-cmd">kubectl rollout undo deploy/visitor</span>
deployment.apps/visitor <span class="t-ok">rolled back</span></pre>
      </div>
      <a href="/" class="btn btn--primary"><span class="btn__icon">↺</span> Roll back to /</a>
    </div>
  </main>
  <script>
    const p = location.pathname.replace(/^\/|\/$/g, "").split("/").pop().slice(0, 24) || "this-page";
    document.getElementById("path").textContent = p;
    document.getElementById("path2").textContent = p.padEnd(13, " ").slice(0, 13);
  </script>
</body>
</html>
